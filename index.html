<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我</title>
    <style>
        /* 简单美化，按钮更大更显眼 */
        body { display: flex; flex-direction: column; align-items: center; margin-top: 50px; font-family:  Arial, sans-serif; }
        .btn { 
            width: 280px; 
            height: 60px; 
            line-height: 60px; 
            text-align: center; 
            margin: 15px 0; 
            border: none; 
            border-radius: 30px; 
            font-size: 20px; 
            color: white; 
            cursor: pointer; 
            text-decoration: none; 
        }
        .call-btn { background-color: #2d8cf0; } /* 蓝色：打电话 */
        .sms-btn { background-color: #19be6b; } /* 绿色：发短信 */
        .btn:hover { opacity: 0.9; } /* 点击时轻微变暗 */
    </style>
</head>
<body>
    <h1>扫码联系我</h1>
    <!-- 按钮文字改成“拨打电话”，隐藏手机号明文 -->
    <a href="tel:17681831076" class="btn call-btn">📞 拨打电话</a>
    <!-- 按钮文字改成“发送短信”，可自定义短信内容（=后面的文字） -->
    <a href="sms:17681831076?body=您好车主，打扰了！" class="btn sms-btn">📩 发送短信</a>
</body>
</html>
